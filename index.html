<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rangrezz — Catalog Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
  /* Backgrounds: Clean Cream & Off-White */
  --bg: #FAF8F5;
  --bg-elevated: #FFFFFF;
  --bg-card: #F2ECE4;

  /* Typography Colors */
  --ivory: #1E1A1D;       /* Dark Text for High Readability */
  --ivory-dim: #5C525A;   /* Muted Secondary Text */

  /* Accent Colors */
  --gold: #C58C28;       /* Metallic Deep Gold */
  --marigold: #DF9B20;   /* Bright Accent */
  --blush: #A61C2B;      /* Deep Red */

  /* Structural UI */
  --line: rgba(166, 28, 43, 0.12); /* Subtle Crimson Tint */
  --whatsapp: #25D366;
}
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 15% 0%, rgba(212,166,87,0.10), transparent 45%),
      radial-gradient(circle at 90% 20%, rgba(232,180,196,0.08), transparent 40%),
      var(--bg);
    color:var(--ivory);
    font-family:'Manrope', sans-serif;
    min-height:100vh;
    padding-bottom:70px;
  }
  header{ padding:36px 20px 20px; text-align:center; border-bottom:1px solid var(--line); }
  .eyebrow{ font-size:12px; letter-spacing:.18em; text-transform:uppercase; color:var(--gold); margin-bottom:10px; }
  h1{ font-family:'Fraunces', serif; font-weight:700; font-size:clamp(30px,6vw,48px); margin:0 0 8px; letter-spacing:-0.01em; }
  h1 em{ color:var(--marigold); font-style:italic; }
  .tagline{ color:var(--ivory-dim); font-size:15px; max-width:440px; margin:0 auto; }
  .hint{ color:var(--ivory-dim); font-size:12.5px; max-width:440px; margin:10px auto 0; opacity:.85; }

  .controls{ max-width:1080px; margin:28px auto 0; padding:0 20px; }
  .search-row{ position:relative; }
  .search-row svg{ position:absolute; left:16px; top:50%; transform:translateY(-50%); width:18px; height:18px; stroke:var(--ivory-dim); }
  .search-row input{ width:100%; padding:15px 16px 15px 46px; background:var(--bg-elevated); border:1px solid var(--line); border-radius:14px; color:var(--ivory); font-family:'Manrope', sans-serif; font-size:15px; }
  .search-row input:focus{ outline:2px solid var(--gold); outline-offset:1px; }
  .search-row input::placeholder{ color:var(--ivory-dim); opacity:.65; }

  .try-row{ display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
  .try-chip{ font-size:12.5px; color:var(--ivory-dim); background:transparent; border:1px dashed var(--line); border-radius:999px; padding:6px 12px; cursor:pointer; font-family:'Manrope',sans-serif; }
  .try-chip:hover{ border-color:var(--gold); color:var(--gold); }

  .filter-row{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; justify-content:space-between; margin-top:20px; }
  .cat-chips{ display:flex; gap:8px; flex-wrap:wrap; }
  .cat-chip{ font-family:'Manrope',sans-serif; font-size:13px; font-weight:600; padding:8px 15px; border-radius:999px; border:1.5px dashed var(--gold); background:transparent; color:var(--ivory); cursor:pointer; }
  .cat-chip.active{ background:var(--gold); color:#211016; border-style:solid; }
  select#sortBy{ background:var(--bg-elevated); color:var(--ivory); border:1px solid var(--line); border-radius:10px; padding:8px 12px; font-family:'Manrope',sans-serif; font-size:13px; }

  .count-row{ max-width:1080px; margin:16px auto 0; padding:0 20px; font-size:13px; color:var(--ivory-dim); display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .select-all-btn{ background:transparent; border:1px dashed var(--gold); color:var(--gold); border-radius:999px; padding:5px 12px; font-family:'Manrope',sans-serif; font-size:12px; font-weight:600; cursor:pointer; white-space:nowrap; }
  .select-all-btn:hover{ background:var(--gold); color:#211016; }

  .grid{ max-width:1080px; margin:14px auto 0; padding:0 20px 40px; display:grid; grid-template-columns:repeat(auto-fill, minmax(190px,1fr)); gap:18px; }
  .card{ background:var(--bg-card); border:1px solid var(--line); border-radius:14px; overflow:hidden; display:flex; flex-direction:column; transition:outline .15s ease; }
  .card.selected{ outline:2px solid var(--gold); outline-offset:-1px; }

  .swatch{ position:relative; height:150px; display:flex; align-items:flex-end; padding:12px; overflow:hidden; cursor:pointer;
    background-image: radial-gradient(circle, rgba(255,255,255,0.25) 1px, transparent 1.4px), linear-gradient(135deg, var(--g1), var(--g2));
    background-size: 14px 14px, cover; }
  .swatch img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:1; opacity:0; transition:opacity .35s ease; }
  .swatch img.loaded{ opacity:1; }
  .swatch::after{ content:""; position:absolute; left:0; right:0; bottom:-1px; height:12px; z-index:2; background:var(--bg-card);
    clip-path: polygon(0% 0%,4% 100%,8% 0%,12% 100%,16% 0%,20% 100%,24% 0%,28% 100%,32% 0%,36% 100%,40% 0%,44% 100%,48% 0%,52% 100%,56% 0%,60% 100%,64% 0%,68% 100%,72% 0%,76% 100%,80% 0%,84% 100%,88% 0%,92% 100%,96% 0%,100% 100%,100% 0%); }
  .swatch span{ position:relative; z-index:1; font-family:'Fraunces', serif; font-style:italic; font-weight:600; font-size:13px; color:rgba(255,255,255,0.92); text-shadow:0 1px 3px rgba(0,0,0,0.35); }

  .select-box{ position:absolute; top:8px; left:8px; z-index:3; width:24px; height:24px; border-radius:50%; border:2px solid rgba(255,255,255,0.9); background:rgba(0,0,0,0.3); display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .select-box.checked{ background:var(--gold); border-color:var(--gold); }
  .select-box svg{ width:13px; height:13px; opacity:0; }
  .select-box.checked svg{ opacity:1; }

  .card-body{ padding:14px 14px 16px; display:flex; flex-direction:column; gap:8px; flex:1; }
  .cat-tag{ align-self:flex-start; font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; border:1px dashed var(--blush); color:var(--blush); border-radius:999px; padding:3px 9px; }
  .card-name{ font-size:14.5px; font-weight:600; line-height:1.3; }
  .card-price{ font-family:'Fraunces', serif; font-weight:700; font-size:19px; color:var(--gold); margin-top:auto; }
  .empty{ max-width:1080px; margin:30px auto; padding:40px 20px; text-align:center; color:var(--ivory-dim); }
  .empty strong{ display:block; color:var(--ivory); font-family:'Fraunces',serif; font-size:20px; margin-bottom:6px; }

  .load-more-wrap{ text-align:center; padding:8px 0 40px; }
  #loadMoreBtn{ background:transparent; border:1.5px solid var(--gold); color:var(--gold); padding:11px 26px; border-radius:999px; font-family:'Manrope',sans-serif; font-weight:700; font-size:13px; cursor:pointer; }
  #loadMoreBtn:hover{ background:var(--gold); color:#211016; }

  /* Floating cart bar */
  .cart-bar{ position:fixed; left:0; right:0; bottom:0; background:var(--bg-elevated); border-top:1px solid var(--gold); padding:14px 20px; display:flex; align-items:center; justify-content:space-between; gap:12px; z-index:60; transform:translateY(110%); transition:transform .25s ease; }
  .cart-bar.show{ transform:translateY(0); }
  .cart-bar-info{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .cart-icon{ font-size:18px; }
  .cart-bar-count{ font-weight:700; font-size:14px; }
  .cart-bar-total{ font-family:'Fraunces',serif; font-weight:700; color:var(--gold); font-size:15px; }
  .view-cart-btn{ background:var(--gold); color:#211016; border:none; border-radius:9px; padding:11px 20px; font-family:'Manrope',sans-serif; font-weight:700; font-size:13px; cursor:pointer; white-space:nowrap; }
  .view-cart-btn:hover{ filter:brightness(1.08); }

  /* Slide-in cart drawer */
  .cart-overlay{ position:fixed; inset:0; background:rgba(20,14,10,0.45); z-index:70; opacity:0; pointer-events:none; transition:opacity .25s ease; }
  .cart-overlay.show{ opacity:1; pointer-events:auto; }
  .cart-drawer{ position:fixed; top:0; right:0; bottom:0; width:min(380px, 90vw); background:var(--bg-elevated); z-index:80; display:flex; flex-direction:column; transform:translateX(100%); transition:transform .3s ease; box-shadow:-8px 0 30px rgba(0,0,0,0.15); }
  .cart-drawer.show{ transform:translateX(0); }
  .cart-drawer-header{ padding:18px 20px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; }
  .cart-drawer-header h3{ margin:0; font-family:'Fraunces',serif; font-size:19px; }
  .cart-clear-link{ background:none; border:none; color:var(--blush); font-family:'Manrope',sans-serif; font-size:12.5px; text-decoration:underline; cursor:pointer; padding:0; }
  .cart-close-btn{ background:none; border:none; font-size:22px; line-height:1; color:var(--ivory-dim); cursor:pointer; padding:0 0 0 14px; }
  .cart-drawer-items{ flex:1; overflow-y:auto; padding:14px 20px; display:flex; flex-direction:column; gap:14px; }
  .cart-empty-msg{ text-align:center; color:var(--ivory-dim); font-size:13.5px; padding:30px 10px; }
  .cart-item{ display:flex; gap:12px; align-items:center; }
  .cart-item-img{ width:56px; height:56px; border-radius:10px; object-fit:cover; flex-shrink:0; background:var(--bg-card); }
  .cart-item-info{ flex:1; min-width:0; }
  .cart-item-name{ font-size:13.5px; font-weight:600; line-height:1.3; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cart-item-price{ font-size:12px; color:var(--ivory-dim); margin-top:2px; }
  .cart-item-qty{ display:flex; align-items:center; gap:8px; flex-shrink:0; }
  .qty-btn{ width:26px; height:26px; border-radius:50%; border:1px solid var(--gold); background:transparent; color:var(--gold); font-size:15px; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0; line-height:1; }
  .qty-btn:hover{ background:var(--gold); color:#211016; }
  .cart-item-qty span{ font-size:13.5px; font-weight:700; min-width:14px; text-align:center; }
  .cart-drawer-footer{ padding:16px 20px 20px; border-top:1px solid var(--line); }
  .cart-total-row{ display:flex; align-items:center; justify-content:space-between; font-family:'Fraunces',serif; font-size:16px; font-weight:700; margin-bottom:12px; }
  .cart-total-row span:last-child{ color:var(--gold); }
  .cart-send-btn{ width:100%; background:var(--whatsapp); color:#0F1F17; border:none; border-radius:999px; padding:13px 12px; font-family:'Manrope',sans-serif; font-weight:700; font-size:14px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; }
  .cart-send-btn:hover{ filter:brightness(1.08); }
  .cart-send-btn svg{ width:16px; height:16px; }

  footer{ text-align:center; padding:24px 20px 40px; color:var(--ivory-dim); font-size:12px; border-top:1px solid var(--line); }

  @media (max-width:480px){
    .grid{ grid-template-columns:repeat(2, 1fr); gap:12px; }
    .filter-row{ flex-direction:column; align-items:stretch; }
    select#sortBy{ width:100%; }
  }
</style>
</head>
<body>

<header>
  <div class="eyebrow">WhatsApp Catalog </div>
  <h1> Aruna Textile Hub <em>Studio</em></h1>
  <p class="tagline">Select karo, share karo — kisi ko bhi, seedha WhatsApp par.</p>
  <p class="hint"></p>
</header>

<div class="controls">
  <div class="search-row">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
    <input id="searchInput" type="text" placeholder="Try: saree under 1500, kurti above 400...">
  </div>
  <div class="try-row">
    <button class="try-chip" data-q="saree under 1000">saree under 1000</button>
    <button class="try-chip" data-q="kurti under 400">kurti under 400</button>
    <button class="try-chip" data-q="lehenga above 3000">lehenga above 3000</button>
    <button class="try-chip" data-q="dupatta under 300">dupatta under 300</button>
  </div>
  <div class="filter-row">
    <div class="cat-chips" id="catChips"></div>
    <select id="sortBy">
      <option value="relevance">Sort: Relevance</option>
      <option value="priceLow">Price: Low to High</option>
      <option value="priceHigh">Price: High to Low</option>
    </select>
  </div>
</div>

<div class="count-row">
  <span id="countText"></span>
  <button class="select-all-btn" id="selectAllBtn">Select All</button>
</div>
<div class="grid" id="grid"></div>
<div id="emptyState" style="display:none" class="empty">
  <strong>Koi item nahi mila</strong>
  Price range badha ke ya category badal ke dekhein.
</div>
<div class="load-more-wrap" id="loadMoreWrap">
  <button id="loadMoreBtn">Load more</button>
</div>

<footer>Demo catalog</footer>

<div class="cart-bar" id="cartBar">
  <div class="cart-bar-info">
    <span class="cart-icon">🛒</span>
    <span class="cart-bar-count" id="cartBarCount">0 Items Selected</span>
    <span class="cart-bar-total" id="cartBarTotal">Total: ₹0</span>
  </div>
  <button class="view-cart-btn" id="viewCartBtn">View Cart</button>
</div>

<div class="cart-overlay" id="cartOverlay"></div>
<div class="cart-drawer" id="cartDrawer">
  <div class="cart-drawer-header">
    <h3>Your Cart</h3>
    <div style="display:flex; align-items:center;">
      <button class="cart-clear-link" id="cartClearBtn">Clear all</button>
      <button class="cart-close-btn" id="cartCloseBtn">&times;</button>
    </div>
  </div>
  <div class="cart-drawer-items" id="cartItemsList"></div>
  <div class="cart-drawer-footer">
    <div class="cart-total-row">
      <span>Total Bill</span>
      <span id="cartDrawerTotal">₹0</span>
    </div>
    <button class="cart-send-btn" id="cartSendBtn">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12c0 1.9.53 3.68 1.44 5.2L2 22l4.94-1.4A9.94 9.94 0 0 0 12 22c5.52 0 10-4.48 10-10S17.52 2 12 2zm0 18c-1.6 0-3.1-.44-4.38-1.2l-.31-.19-3.06.87.85-2.98-.2-.32A7.94 7.94 0 0 1 4 12c0-4.41 3.59-8 8-8s8 3.59 8 8-3.59 8-8 8z"/></svg>
      Send Order to Aruna Textile
    </button>
  </div>
</div>

<script>
  let products = [];

  // Apna business WhatsApp number yahan bina "+" ya space ke dalein, jaise "91XXXXXXXXXX".
  // Khaali chhod dene par order bhejte waqt WhatsApp customer ko khud contact chunne dega.
  const WHATSAPP_NUMBER = "";

  // A real image/product URL can contain commas (e.g. Cloudinary transform
  // params like q_auto,f_auto,w_500). Google Sheets wraps such fields in
  // quotes in its CSV export, so a naive row.split(",") shreds the URL.
  // This parser respects quotes properly.
  function parseCSVLine(line){
    const result = [];
    let cur = '', inQuotes = false;
    for(let i=0; i<line.length; i++){
      const ch = line[i];
      if(ch === '"'){
        if(inQuotes && line[i+1] === '"'){ cur += '"'; i++; }
        else inQuotes = !inQuotes;
      } else if(ch === ',' && !inQuotes){
        result.push(cur); cur = '';
      } else {
        cur += ch;
      }
    }
    result.push(cur);
    return result;
  }

  async function loadProductsFromSheet() {
    // 1. Apna link yaha rehne dein
    const sheetCSVUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRE7C6_CKPQTvaU-uvxrLz69YOEtAmh7Sdsw0RDr52MsoyX9b8gD9b0El1H23o4gxBiy7woMCBzRmWJ/pub?gid=0&single=true&output=csv"; 
    
    // 2. Wo purana 'if' block yaha se hat gaya hai

    try {
      const response = await fetch(sheetCSVUrl);
      const data = await response.text();
      
      const rows = data.split(/\r\n|\n|\r/).slice(1).filter(r => r.trim());
      products = rows.map((row, index) => {
        const cols = parseCSVLine(row);
        return {
          id: index + 1,
          name: cols[0]?.replace(/"/g, '').trim(),
          category: cols[1]?.replace(/"/g, '').trim(),
          price: parseInt(cols[2]) || 0,
          image: cols[3]?.replace(/"/g, '').trim()
        };
      }).filter(p => p.name);
      
      render(); 
    } catch (error) {
      console.error("Data load karne me dikkat aayi:", error);
      alert("Sheet se data fetch nahi ho paya. CSV link check karein.");
    }
}

  const CAT_COLORS = {
    Saree:['#7A1E3C','#D4A657'], Kurti:['#1F5C52','#6FBFAE'], Lehenga:['#8E2A5B','#E8B4C4'],
    Suit:['#7A4A1E','#E8873A'], Dupatta:['#4A2E6E','#B48CD9'], Blouse:['#6E1F1F','#C9622F']
  };
  function getColors(cat){ return CAT_COLORS[cat] || ['#4A4A52','#7A7A85']; }

  let activeCategory = 'All';
  let searchQuery = '';
  let sortBy = 'relevance';
  let visibleCount = 24;
  const PAGE_SIZE = 24;
  let cart = new Map(); // productId -> quantity

  function parseQuery(q){
    q = q.toLowerCase().trim();
    let minPrice = null, maxPrice = null;
    const between = q.match(/between\s*(\d+)\s*(?:and|to|-)\s*(\d+)/);
    const under = q.match(/(?:under|below|se kam)\s*(\d+)/);
    const above = q.match(/(?:above|over|se zyada|se jyada)\s*(\d+)/);
    if(between){ minPrice = parseInt(between[1]); maxPrice = parseInt(between[2]); }
    if(under){ maxPrice = parseInt(under[1]); }
    if(above){ minPrice = parseInt(above[1]); }
    let text = q
      .replace(/between\s*\d+\s*(?:and|to|-)\s*\d+/, '')
      .replace(/(?:under|below|se kam)\s*\d+/, '')
      .replace(/(?:above|over|se zyada|se jyada)\s*\d+/, '')
      .replace(/rs\.?|rupees|₹/g, '').trim();
    return { text, minPrice, maxPrice };
  }

  function getFiltered(){
    const { text, minPrice, maxPrice } = parseQuery(searchQuery);
    let list = products.filter(p=>{
      if(activeCategory !== 'All' && p.category !== activeCategory) return false;
      if(minPrice != null && p.price < minPrice) return false;
      if(maxPrice != null && p.price > maxPrice) return false;
      if(text){
        const hay = (p.name + ' ' + p.category).toLowerCase();
        const words = text.split(/\s+/).filter(Boolean);
        for(const w of words){ if(!hay.includes(w)) return false; }
      }
      return true;
    });
    if(sortBy === 'priceLow') list = list.slice().sort((a,b)=>a.price-b.price);
    if(sortBy === 'priceHigh') list = list.slice().sort((a,b)=>b.price-a.price);
    return list;
  }

  function toggleSelect(id){
    if(cart.has(id)) cart.delete(id); else cart.set(id, 1);
    const card = document.querySelector(`.card[data-id="${id}"]`);
    if(card){
      card.classList.toggle('selected', cart.has(id));
      card.querySelector('.select-box').classList.toggle('checked', cart.has(id));
    }
    renderCartBar();
    renderCartDrawer();
  }
  window.toggleSelect = toggleSelect;

  function incrementQty(id){
    cart.set(id, (cart.get(id) || 0) + 1);
    renderCartBar();
    renderCartDrawer();
  }
  window.incrementQty = incrementQty;

  function decrementQty(id){
    const q = cart.get(id) || 0;
    if(q <= 1){
      cart.delete(id);
      const card = document.querySelector(`.card[data-id="${id}"]`);
      if(card){
        card.classList.remove('selected');
        const box = card.querySelector('.select-box');
        if(box) box.classList.remove('checked');
      }
    } else {
      cart.set(id, q - 1);
    }
    renderCartBar();
    renderCartDrawer();
  }
  window.decrementQty = decrementQty;

  function cartTotals(){
    let totalItems = 0, totalPrice = 0;
    cart.forEach((qty, id)=>{
      const p = products.find(x=>x.id===id);
      if(!p) return;
      totalItems += qty;
      totalPrice += p.price * qty;
    });
    return { totalItems, totalPrice };
  }

  function renderCartBar(){
    const bar = document.getElementById('cartBar');
    if(cart.size === 0){ bar.classList.remove('show'); return; }
    const { totalItems, totalPrice } = cartTotals();
    bar.classList.add('show');
    document.getElementById('cartBarCount').textContent = `${totalItems} Item${totalItems>1?'s':''} Selected`;
    document.getElementById('cartBarTotal').textContent = `Total: ₹${totalPrice.toLocaleString('en-IN')}`;
  }

  function renderCartDrawer(){
    const list = document.getElementById('cartItemsList');
    const entries = [...cart.entries()];
    if(entries.length === 0){
      list.innerHTML = `<div class="cart-empty-msg">Cart khaali hai — kisi bhi photo par tap karke item add karein.</div>`;
    } else {
      list.innerHTML = entries.map(([id, qty])=>{
        const p = products.find(x=>x.id===id);
        if(!p) return '';
        const [g1] = getColors(p.category);
        const thumb = p.image
          ? `<img class="cart-item-img" src="${p.image}" alt="${p.name}">`
          : `<div class="cart-item-img" style="background:${g1}"></div>`;
        return `
          <div class="cart-item" data-id="${p.id}">
            ${thumb}
            <div class="cart-item-info">
              <div class="cart-item-name">${p.name}</div>
              <div class="cart-item-price">₹${p.price.toLocaleString('en-IN')} × ${qty} = ₹${(p.price*qty).toLocaleString('en-IN')}</div>
            </div>
            <div class="cart-item-qty">
              <button class="qty-btn" onclick="decrementQty(${p.id})">−</button>
              <span>${qty}</span>
              <button class="qty-btn" onclick="incrementQty(${p.id})">+</button>
            </div>
          </div>`;
      }).join('');
    }
    const { totalPrice } = cartTotals();
    document.getElementById('cartDrawerTotal').textContent = `₹${totalPrice.toLocaleString('en-IN')}`;
  }

  function openCart(){
    document.getElementById('cartDrawer').classList.add('show');
    document.getElementById('cartOverlay').classList.add('show');
  }
  function closeCart(){
    document.getElementById('cartDrawer').classList.remove('show');
    document.getElementById('cartOverlay').classList.remove('show');
  }

  function sendCartOrder(){
    const entries = [...cart.entries()];
    if(entries.length === 0) return;
    let totalItems = 0, totalPrice = 0;
    const lines = entries.map(([id, qty], i)=>{
      const p = products.find(x=>x.id===id);
      if(!p) return '';
      totalItems += qty;
      totalPrice += p.price * qty;
      return `${i+1}. ${p.name} - ${qty} Pcs (₹${(p.price*qty).toLocaleString('en-IN')})`;
    }).filter(Boolean);

    const message = `Hello, mujhe ye order karna hai:\n${lines.join('\n')}\nTotal Items: ${totalItems}\nTotal Price: ₹${totalPrice.toLocaleString('en-IN')}`;

    const waUrl = WHATSAPP_NUMBER
      ? `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`
      : `https://wa.me/?text=${encodeURIComponent(message)}`;
    window.open(waUrl, '_blank');
  }
  window.sendCartOrder = sendCartOrder;

  function renderChips(){
    const wrap = document.getElementById('catChips');
    if(products.length === 0) return;
    const cats = ['All', ...new Set(products.map(p=>p.category))];
    wrap.innerHTML = cats.map(c=>
      `<button class="cat-chip ${c===activeCategory?'active':''}" data-cat="${c}">${c}</button>`
    ).join('');
    wrap.querySelectorAll('.cat-chip').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        activeCategory = btn.dataset.cat;
        visibleCount = PAGE_SIZE;
        render();
      });
    });
  }

  function cardHTML(p){
    const [g1,g2] = getColors(p.category);
    const imageInner = p.image
      ? `<img src="${p.image}" alt="${p.name}" loading="lazy" decoding="async" onload="this.classList.add('loaded')">`
      : `<span>${p.category}</span>`;
    const isSel = cart.has(p.id);
    return `
      <div class="card ${isSel?'selected':''}" data-id="${p.id}">
        <div class="swatch" style="--g1:${g1};--g2:${g2}" onclick="toggleSelect(${p.id})">
          <div class="select-box ${isSel?'checked':''}">
            <svg viewBox="0 0 24 24" fill="none" stroke="#1B0E14" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
          </div>
          ${imageInner}
        </div>
        <div class="card-body">
          <div class="cat-tag">${p.category}</div>
          <div class="card-name">${p.name}</div>
          <div class="card-price">₹${p.price.toLocaleString('en-IN')}</div>
        </div>
      </div>`;
  }

  function toggleSelectAll(){
    const filtered = getFiltered();
    const allSelected = filtered.length > 0 && filtered.every(p=>cart.has(p.id));
    if(allSelected){
      filtered.forEach(p=>cart.delete(p.id));
    } else {
      filtered.forEach(p=>{ if(!cart.has(p.id)) cart.set(p.id, 1); });
    }
    render();
  }

  function render(){
    renderChips();
    const filtered = getFiltered();
    const grid = document.getElementById('grid');
    const empty = document.getElementById('emptyState');
    const countText = document.getElementById('countText');
    const selectAllBtn = document.getElementById('selectAllBtn');
    const loadMoreWrap = document.getElementById('loadMoreWrap');

    countText.textContent = `${filtered.length} item${filtered.length!==1?'s':''} mile`;
    const allSelected = filtered.length > 0 && filtered.every(p=>cart.has(p.id));
    selectAllBtn.textContent = allSelected ? 'Deselect All' : 'Select All';
    selectAllBtn.style.display = filtered.length ? 'inline-block' : 'none';

    if(filtered.length === 0){
      grid.innerHTML = '';
      empty.style.display = 'block';
      loadMoreWrap.style.display = 'none';
      return;
    }
    empty.style.display = 'none';
    const visible = filtered.slice(0, visibleCount);
    grid.innerHTML = visible.map(cardHTML).join('');
    loadMoreWrap.style.display = visibleCount < filtered.length ? 'block' : 'none';
    renderCartBar();
    renderCartDrawer();
  }

  document.getElementById('searchInput').addEventListener('input', (e)=>{
    searchQuery = e.target.value; visibleCount = PAGE_SIZE; render();
  });
  document.getElementById('sortBy').addEventListener('change', (e)=>{ sortBy = e.target.value; render(); });
  document.getElementById('loadMoreBtn').addEventListener('click', ()=>{ visibleCount += PAGE_SIZE; render(); });
  document.getElementById('selectAllBtn').addEventListener('click', toggleSelectAll);
  document.querySelectorAll('.try-chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      searchQuery = chip.dataset.q;
      document.getElementById('searchInput').value = searchQuery;
      visibleCount = PAGE_SIZE; render();
    });
  });
  document.getElementById('viewCartBtn').addEventListener('click', openCart);
  document.getElementById('cartCloseBtn').addEventListener('click', closeCart);
  document.getElementById('cartOverlay').addEventListener('click', closeCart);
  document.getElementById('cartClearBtn').addEventListener('click', ()=>{ cart.clear(); closeCart(); render(); });
  document.getElementById('cartSendBtn').addEventListener('click', sendCartOrder);

  loadProductsFromSheet(); 
</script>
</body>
</html>
